<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تجميع النجوم - ليلى ويعقوب ويزيد</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; touch-action: none; }
#startScreen, #gameScreen { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#startScreen { background: linear-gradient(180deg, #0f3460, #533483); }
h1 { font-size: 2.2rem; margin-bottom: 10px; text-shadow: 0 0 20px gold; }
.subtitle { font-size: 1.1rem; opacity: 0.9; margin-bottom: 30px; }
.characters { display: flex; flex-direction: column; gap: 15px; width: 90%; max-width: 400px; }
.char-btn { background: rgba(255,255,255,0.15); border: 3px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.2s; }
.char-btn:active { transform: scale(0.97); background: rgba(255,255,255,0.25); }
.avatar { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; border: 3px solid white; }
.char-info h3 { font-size: 1.4rem; margin-bottom: 2px; }
.char-info p { font-size: 0.9rem; opacity: 0.8; }
#gameScreen { display: none; background: linear-gradient(180deg, #0a0a23, #1a1a40); }
canvas { display: block; }
#ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
.stat { background: rgba(0,0,0,0.5); padding: 8px 14px; border-radius: 20px; font-size: 1rem; font-weight: bold; }
#controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 40px; z-index: 10; }
.ctrl-btn { width: 90px; height: 90px; background: rgba(255,255,255,0.25); border: 4px solid white; border-radius: 50%; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
.ctrl-btn:active { background: rgba(255,255,255,0.45); transform: scale(0.95); }
#topButtons { position: absolute; top: 55px; right: 10px; display: flex; gap: 8px; z-index: 10; }
.small-btn { background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 12px; padding: 6px 12px; font-size: 0.9rem; pointer-events: auto; }
#celebration { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; align-items: center; justify-content: center; flex-direction: column; }
.celeb-msg { font-size: 1.8rem; text-align: center; text-shadow: 0 0 20px gold; background: rgba(0,0,0,0.7); padding: 25px; border-radius: 25px; margin: 15px; line-height: 1.4; }
.progress-bar { width: 130px; height: 12px; background: rgba(255,255,255,0.3); border-radius: 6px; overflow: hidden; margin-top: 5px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #ffd700, #ffaa00); width: 0%; transition: width 0.3s; }
</style>
</head>
<body>
<div id="startScreen">
  <h1>⭐ تجميع النجوم ⭐</h1>
  <p class="subtitle">اختر من سيلعب اليوم!</p>
  <div class="characters">
    <div class="char-btn" onclick="startGame('layla')">
      <div class="avatar" style="background:#8B0000;">👧</div>
      <div class="char-info"><h3>ليلى</h3><p>6 سنوات • سريعة ومرحة</p></div>
    </div>
    <div class="char-btn" onclick="startGame('yaqoub')">
      <div class="avatar" style="background:#f5f5f5; color:#333;">👦</div>
      <div class="char-info"><h3>يعقوب</h3><p>3 سنوات • نشيط ومرح</p></div>
    </div>
    <div class="char-btn" onclick="startGame('yazeed')">
      <div class="avatar" style="background:#e74c3c;">👶</div>
      <div class="char-info"><h3>يزيد</h3><p>سنة واحدة • لطيف وسهل جداً</p></div>
    </div>
  </div>
</div>

<div id="gameScreen">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div class="stat">⭐ <span id="starCount">0</span></div>
    <div class="stat">المستوى <span id="level">1</span>
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    </div>
  </div>
  <div id="topButtons">
    <button class="small-btn" onclick="toggleSound()">🔊</button>
    <button class="small-btn" onclick="restartGame()">🔄 إعادة</button>
    <button class="small-btn" onclick="changePlayer()">👤 تغيير</button>
  </div>
  <div id="controls">
    <div class="ctrl-btn" id="leftBtn">◀</div>
    <div class="ctrl-btn" id="rightBtn">▶</div>
  </div>
  <div id="celebration">
    <div class="celeb-msg" id="celebText"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const characters = {
  layla:   { name: 'ليلى',   key: 'layla',   color: '#8B0000', emoji: '👧', speed: 8.5, starSize: 30, obstacleRate: 0.35, golden: true },
  yaqoub:  { name: 'يعقوب',  key: 'yaqoub',  color: '#ffffff', emoji: '👦', speed: 6.2, starSize: 38, obstacleRate: 0.18, golden: false },
  yazeed:  { name: 'يزيد',   key: 'yazeed',  color: '#e74c3c', emoji: '👶', speed: 4.2, starSize: 52, obstacleRate: 0.04, golden: false }
};

let currentChar = null;
let player = { x: 0, y: 0, w: 75, h: 85 };
let stars = [], obstacles = [], particles = [];
let score = 0, level = 1, starsInLevel = 0;
let gameRunning = false, soundOn = true, celebrating = false;
let keys = { left: false, right: false };

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, dur = 0.15, type = 'sine') {
  if (!soundOn) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function startGame(charKey) {
  currentChar = characters[charKey];
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  resetGame();
  gameRunning = true;
  requestAnimationFrame(loop);
}

function resetGame() {
  score = 0; level = 1; starsInLevel = 0; celebrating = false;
  stars = []; obstacles = []; particles = [];
  player.x = W / 2 - player.w / 2;
  player.y = H - 150;
  updateUI();
  document.getElementById('celebration').style.display = 'none';
}

function updateUI() {
  document.getElementById('starCount').textContent = score;
  document.getElementById('level').textContent = level;
  const prog = Math.min(100, (score % 20) / 20 * 100);
  document.getElementById('progress').style.width = prog + '%';
}

function spawnStar() {
  const isGolden = currentChar.golden && Math.random() < 0.18;
  stars.push({
    x: Math.random() * (W - 70) + 35,
    y: -50,
    size: currentChar.starSize + (isGolden ? 12 : 0),
    speed: 2.2 + level * 0.28 + (currentChar.key === 'yazeed' ? -0.6 : 0),
    golden: isGolden,
    points: isGolden ? 3 : 1
  });
}

function spawnObstacle() {
  if (Math.random() > currentChar.obstacleRate) return;
  obstacles.push({
    x: Math.random() * (W - 90) + 45,
    y: -60,
    speed: 1.4 + level * 0.18,
    type: Math.random() < 0.5 ? 'cloud' : 'bubble'
  });
}

function createParticles(x, y, color = 'gold', count = 14) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 9,
      vy: (Math.random() - 0.5) * 9 - 3,
      life: 45,
      color
    });
  }
}

function checkCollision(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function loop() {
  if (!gameRunning) return;
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let i = 0; i < 35; i++) {
    ctx.beginPath();
    ctx.arc((i * 89) % W, (Date.now() / 45 + i * 35) % H, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }

  if (keys.left) player.x -= currentChar.speed;
  if (keys.right) player.x += currentChar.speed;
  player.x = Math.max(8, Math.min(W - player.w - 8, player.x));

  ctx.save();
  ctx.translate(player.x + player.w/2, player.y + player.h/2);
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = currentChar.color;
  ctx.beginPath();
  ctx.arc(0, 0, 38, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.font = '52px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(currentChar.emoji, 0, 2);
  ctx.restore();

  if (Math.random() < 0.028 + level * 0.004) spawnStar();
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.y += s.speed;
    ctx.fillStyle = s.golden ? '#ffd700' : '#fff';
    ctx.strokeStyle = s.golden ? '#ffaa00' : '#ccc';
    ctx.lineWidth = 2.5;
    drawStar(s.x, s.y, s.size/2, s.size/4.5, 5);
    ctx.fill(); ctx.stroke();
    if (s.golden) {
      ctx.fillStyle = 'rgba(255,215,0,0.45)';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size/2 + 6, 0, Math.PI*2); ctx.fill();
    }

    const starBox = { x: s.x - s.size/2, y: s.y - s.size/2, w: s.size, h: s.size };
    if (checkCollision(player, starBox)) {
      score += s.points;
      starsInLevel++;
      createParticles(s.x, s.y, s.golden ? '#ffd700' : '#fff');
      playSound(s.golden ? 880 : 640, 0.13);
      stars.splice(i, 1);
      updateUI();
      if (score > 0 && score % 20 === 0 && !celebrating) triggerCelebration();
      if (starsInLevel >= 7) { level++; starsInLevel = 0; playSound(750, 0.1); setTimeout(() => playSound(950, 0.15), 120); }
      continue;
    }
    if (s.y > H + 60) stars.splice(i, 1);
  }

  if (Math.random() < 0.012) spawnObstacle();
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.y += o.speed;
    ctx.globalAlpha = 0.65;
    if (o.type === 'cloud') {
      ctx.fillStyle = '#bbb';
      ctx.beginPath();
      ctx.ellipse(o.x, o.y, 38, 22, 0, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(160,210,255,0.55)';
      ctx.beginPath();
      ctx.arc(o.x, o.y, 26, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const obsBox = { x: o.x - 32, y: o.y - 22, w: 64, h: 44 };
    if (checkCollision(player, obsBox) && currentChar.key !== 'yazeed') {
      if (score > 0) score = Math.max(0, score - 1);
      createParticles(o.x, o.y, '#999', 8);
      playSound(180, 0.22, 'triangle');
      obstacles.splice(i, 1);
      updateUI();
      continue;
    }
    if (o.y > H + 70) obstacles.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    ctx.globalAlpha = p.life / 45;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, Math.PI*2); ctx.fill();
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}

function drawStar(cx, cy, outer, inner, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outer : inner;
    const a = (i * Math.PI) / points - Math.PI / 2;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function triggerCelebration() {
  celebrating = true;
  const msgs = {
    layla: 'مبروك يا ليلى!<br>أنتِ نجمة حقيقية ⭐✨',
    yaqoub: 'بطل يا يعقوب!<br>واصل جمع النجوم 🌟',
    yazeed: 'يا سلام على يزيد!<br>رائع جداً 🎉❤️'
  };
  document.getElementById('celebText').innerHTML = msgs[currentChar.key];
  document.getElementById('celebration').style.display = 'flex';
  for (let i = 0; i < 50; i++) createParticles(W/2 + (Math.random()-0.5)*200, H/2, Math.random()>0.5 ? '#ffd700' : '#ff69b4', 1);
  playSound(523, 0.25); setTimeout(() => playSound(659, 0.25), 180); setTimeout(() => playSound(784, 0.35), 360);
  setTimeout(() => {
    document.getElementById('celebration').style.display = 'none';
    celebrating = false;
  }, 3800);
}

const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
leftBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.left = true; });
leftBtn.addEventListener('touchend', e => { e.preventDefault(); keys.left = false; });
rightBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.right = true; });
rightBtn.addEventListener('touchend', e => { e.preventDefault(); keys.right = false; });

let dragging = false;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  dragging = true;
  player.x = e.touches[0].clientX - player.w / 2;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (dragging) player.x = e.touches[0].clientX - player.w / 2;
});
canvas.addEventListener('touchend', () => dragging = false);

function toggleSound() {
  soundOn = !soundOn;
  document.querySelector('#topButtons button').textContent = soundOn ? '🔊' : '🔇';
}
function restartGame() { resetGame(); }
function changePlayer() {
  gameRunning = false;
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
}

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
